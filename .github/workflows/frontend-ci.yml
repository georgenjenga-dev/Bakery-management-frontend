name: Frontend CI

on:
  push:
    branches:
      - main
      - dev
      - member-1
      - member-2
      - member-3
      - member-4

  pull_request:
    branches:
      - main
      - dev

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build